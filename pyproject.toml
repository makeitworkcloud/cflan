[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cflan"
version = "1.1.0"
description = "NetworkManager-driven Cloudflare DNS updates for LAN hosts"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Steven Welch", email = "steven@makeitwork.cloud"}
]
requires-python = ">=3.10"
dependencies = [
    "cloudflare>=3,<6",
    "netifaces>=0.11,<1",
    "PyYAML>=6,<7",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: System :: Networking",
]
keywords = ["cloudflare", "dns", "networkmanager"]

[project.optional-dependencies]
dev = [
    "build",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "types-PyYAML",
    "vulture",
]

[project.scripts]
cflan-set-dns = "set_dns:main"

[project.urls]
Homepage = "https://github.com/makeitworkcloud/cflan"
Repository = "https://github.com/makeitworkcloud/cflan"
Issues = "https://github.com/makeitworkcloud/cflan/issues"
Security = "https://github.com/makeitworkcloud/cflan/security/policy"

[tool.hatch.build.targets.wheel]
only-include = ["set_dns.py"]

[tool.ruff]
target-version = "py310"
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.vulture]
paths = ["set_dns.py", "install.py"]
min_confidence = 80

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
strict = true
show_error_codes = true
exclude = ["tests/", "venv/", ".venv/"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

[tool.coverage.run]
source = ["set_dns"]
branch = true
omit = ["tests/*", "install.py", ".venv/*", "venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
fail_under = 70
